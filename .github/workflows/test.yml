name: tests
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  linux-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: ['lts/*', 'lts/-1']
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - uses: google/wireit@setup-github-actions-caching/v2
        continue-on-error: true

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: npm test
        run: npm test

  windows-unit-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        node_version: ['lts/*', 'lts/-1']
      fail-fast: false
    steps:
      - run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - uses: google/wireit@setup-github-actions-caching/v2
        continue-on-error: true

      - run: npm ci --ignore-scripts

      - run: npm run build

      - name: Verify command snapshots are committed
        run: git diff --exit-code -- "**/command-snapshot.json"

      - name: npm test
        run: npm test
