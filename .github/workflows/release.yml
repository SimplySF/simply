name: release

on:
  push:
    branches:
      - main
      - prerelease/**
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Prerelease identifier (beta, dev, etc). Leave blank to only publish already-tagged versions that are missing from npm.'
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install npm --global

      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm test

      - name: Version and publish (release)
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: npx lerna publish --conventional-commits --create-release github --yes
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Version and publish (prerelease)
        if: (github.event_name == 'push' && github.ref_name != 'main') || (github.event_name == 'workflow_dispatch' && inputs.prerelease)
        run: npx lerna publish --conventional-commits --conventional-prerelease --preid "${{ inputs.prerelease || 'dev' }}" --create-release github --yes
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish tagged versions missing from npm
        if: github.event_name == 'workflow_dispatch' && !inputs.prerelease
        run: npx lerna publish from-package --yes
        env:
          NPM_CONFIG_PROVENANCE: true
